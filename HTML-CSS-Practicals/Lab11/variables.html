<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Student: Tanishk Jaiswal | Roll No: 2410303504 | Lab 11 Task 2 -->
  <meta charset="UTF-8">
  <title>CSS Variables</title>
  <style>
    :root {
      --main-color: #1d3557;
      --accent-color: #e63946;
      --page-padding: 20px;
    }
    body { color: var(--main-color); padding: var(--page-padding); }
    h1 { color: var(--accent-color); }
  </style>
</head>
<body>
  <h1>CSS Variables</h1>
  <p>Reusable colours and spacing make styling consistent.</p>
</body>
</html>
